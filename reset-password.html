<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MREC — Reset password</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="brand-panel" aria-label="MREC branding">
      <a class="brand" href="index.html" aria-label="MREC home"><span class="brand-m">M</span>REC</a>
      <p class="brand-tag">U P L O A D&nbsp; • &nbsp;C R E A T E&nbsp; • &nbsp;S H A R E</p>
      <div class="brand-copy">
        <p class="eyebrow">YOUR VIDEOS</p>
        <h2>BELONG HERE</h2>
        <span class="accent-line"></span>
        <p class="sub-copy">SIMPLE UPLOAD.<br>BIGGER STORIES.</p>
      </div>
    </section>

    <section class="form-panel">
      <div class="form-card">
        <div class="mini-logo"><span>M</span>REC</div>
        <h1>Set a new password</h1>
        <p class="subtitle" id="reset-subtitle">Checking your reset link...</p>

        <form id="reset-form" class="hidden" novalidate>
          <div class="field">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" placeholder="Enter new password" autocomplete="new-password" minlength="8" required>
            <small class="hint">At least 8 characters.</small>
            <small class="error" id="new-password-error"></small>
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" placeholder="Repeat new password" autocomplete="new-password" required>
            <small class="error" id="confirm-password-error"></small>
          </div>
          <button class="primary-button" type="submit">Update password</button>
          <p class="form-note" id="reset-message" role="status"></p>
        </form>

        <p class="switch-copy"><a href="index.html">Back to log in</a></p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
