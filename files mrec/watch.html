<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MREC — Watch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dash">
    <header class="dash-top">
      <a class="brand" href="dashboard.html"><span class="brand-m">M</span>REC</a>
      <a class="small-button" id="home-link" href="index.html">Log in</a>
    </header>
    <section class="watch">
      <p class="empty" id="status">Loading video...</p>
      <video id="player" controls playsinline style="display:none;"></video>
      <h1 class="dash-title" id="video-title"></h1>
      <p class="watch-meta" id="video-meta"></p>
      <div class="video-actions" id="watch-actions" style="display:none;">
        <button class="small-button" id="copy-btn" type="button">Copy link</button>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="watch.js"></script>
</body>
</html>
